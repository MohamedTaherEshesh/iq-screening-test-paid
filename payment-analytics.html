<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OMSAZE — Payment Analytics</title>
<style>
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;margin:0;background:#f4f6fa;color:#1d2433}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:18px}
h1{font-size:22px;margin:0 0 4px;color:#1f4e9c}
.sub{color:#5b6577;font-size:13px;margin:0 0 18px}
label{font-size:13px;display:block;margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid #c9d1df;border-radius:8px;font-size:15px;box-sizing:border-box;background:#fff;margin-bottom:14px}
button{background:#1f4e9c;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
button.ghost{background:#e7ecf5;color:#1d2433}
.err{color:#c0392b;font-size:13px;min-height:16px;margin:4px 0 0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}
.metric{background:#f0f4fb;border-radius:10px;padding:16px;text-align:center}
.metric b{display:block;font-size:26px;color:#1f4e9c}
.metric span{font-size:12px;color:#4a5568}
.bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.bar-row .label{width:140px;flex:none;color:#4a5568}
.bar-row .track{flex:1;background:#eef2f8;border-radius:6px;height:10px;overflow:hidden}
.bar-row .fill{height:100%;background:#1f4e9c}
.bar-row .count{width:40px;text-align:end;flex:none;color:#1d2433;font-weight:600}
.note{font-size:12px;color:#5b6577;background:#f7f9fc;border-left:3px solid #c9d1df;padding:10px 12px;border-radius:6px}
</style></head>
<body><div class="wrap">
<div class="card" id="loginCard">
  <h1>OMSAZE — Payment Analytics</h1>
  <p class="sub">Owner-only. A one-time code is required every visit.</p>
  <div id="loginBody">
    <label for="email">Admin email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <div id="codeWrap" style="display:none">
      <label for="code">Verification code</label>
      <input id="code" inputmode="numeric" maxlength="8">
    </div>
    <button type="button" id="go">Request code</button>
    <p class="err" id="msg"></p>
  </div>
</div>
<div id="dashboard" style="display:none"></div>
</div>
<script src="./staging-config.js"></script>
<script>
const BASE=window.OMSAZE_STAGING_API_BASE||'', KEY='sb_publishable_Xg48L8YEyp6wLSgDo4_7ww_ljIgB3H_';
function storedToken(){
  try{const raw=sessionStorage.getItem('omsaze-admin-token');if(!raw)return null;const t=JSON.parse(raw);
    if(t&&t.token&&t.exp>Date.now())return t.token;}catch(e){}
  return null;
}
async function call(body,token){
  const headers={'Content-Type':'application/json',apikey:KEY};
  if(token)headers['x-omsaze-admin-token']=token;
  const r=await fetch(BASE+'/payment-dashboard',{method:'POST',headers,body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j;
}
let requested=false;
document.getElementById('go').onclick=async()=>{
  const email=document.getElementById('email').value.trim();
  const msg=document.getElementById('msg');
  try{
    if(!requested){
      await call({action:'requestAccess',email});
      requested=true;document.getElementById('codeWrap').style.display='block';
      document.getElementById('go').textContent='Verify';
      msg.style.color='#2e7d4f';msg.textContent='If that email is authorized, a code was sent — check the inbox.';
    }else{
      const code=document.getElementById('code').value.trim();
      const r=await call({action:'verifyAccess',email,code});
      sessionStorage.setItem('omsaze-admin-token',JSON.stringify({token:r.adminToken,exp:Date.now()+r.expiresInSeconds*1000}));
      showDashboard(r.adminToken);
    }
  }catch(e){msg.style.color='#c0392b';msg.textContent=e.message;}
};
async function showDashboard(token){
  try{
    const j=await call({action:'data'},token);
    document.getElementById('loginCard').style.display='none';
    const d=document.getElementById('dashboard');d.style.display='block';
    const maxCountry=Math.max(1,...j.visitorsByCountry.map(c=>c.count));
    d.innerHTML=`
      <div class="card">
        <h1>Traffic</h1>
        <div class="metrics">
          <div class="metric"><b>${j.totalVisits}</b><span>Total visits</span></div>
          <div class="metric"><b>${j.submittedExams}</b><span>Submitted exams</span></div>
        </div>
      </div>
      <div class="card">
        <h1>Visitors by country</h1>
        ${j.visitorsByCountry.length?j.visitorsByCountry.map(c=>`<div class="bar-row"><span class="label">${c.country}</span><span class="track"><span class="fill" style="width:${c.count/maxCountry*100}%"></span></span><span class="count">${c.count}</span></div>`).join(''):'<p class="note">No geo-tagged visits recorded yet.</p>'}
      </div>
      <div class="card">
        <h1>Payments</h1>
        <div class="metrics">
          <div class="metric"><b>${j.payments.total}</b><span>Total records</span></div>
          <div class="metric"><b>$${(j.payments.paidAmountCents/100).toFixed(2)}</b><span>Paid (${j.payments.paidCount})</span></div>
          <div class="metric"><b>${j.payments.pendingCount}</b><span>Pending</span></div>
          <div class="metric"><b>${j.payments.failedCount}</b><span>Failed</span></div>
        </div>
        ${j.payments.total===0?'<p class="note">No payment records yet — the staging payment gateway has not processed a transaction. This dashboard reads the real payments table and will populate once Paymob sandbox transactions are wired in.</p>':''}
      </div>
      <div class="card">
        <h1>Refunds</h1>
        <div class="metrics">
          <div class="metric"><b>${j.refunds.requested}</b><span>Requested</span></div>
          <div class="metric"><b>${j.refunds.accepted}</b><span>Accepted</span></div>
          <div class="metric"><b>${j.refunds.rejected}</b><span>Rejected</span></div>
        </div>
      </div>
      <p class="note">Last updated ${new Date(j.serverNow).toLocaleString()} · staging data only, isolated from production.</p>
      <button type="button" class="ghost" onclick="sessionStorage.removeItem('omsaze-admin-token');location.reload()">Sign out</button>`;
  }catch(e){
    sessionStorage.removeItem('omsaze-admin-token');
    document.getElementById('msg').textContent='Session expired: '+e.message;
  }
}
const existing=storedToken();
if(existing)showDashboard(existing);
</script>
</body></html>
