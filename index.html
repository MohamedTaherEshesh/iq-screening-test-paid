<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindProof - Cognitive Assessment</title>
<style>
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;margin:0;background:#f4f6fa;color:#1d2433}
.card{max-width:720px;margin:24px auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 10px}
h2{font-size:18px;margin:18px 0 6px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input,select{width:100%;padding:10px;border:1px solid #c9d1df;border-radius:8px;font-size:15px;box-sizing:border-box;background:#fff}
button{background:#1f4e9c;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
button:disabled{background:#9aa6bd;cursor:default}
button.ghost{background:#e7ecf5;color:#1d2433}
.opt{display:block;width:100%;text-align:start;margin:8px 0;background:#f0f4fb;color:#1d2433;border:2px solid transparent;font-size:16px;padding:12px}
.opt.sel{border-color:#1f4e9c;background:#dfe9fb}
.opt:disabled{background:#f3f4f6;color:#6b7280}
.timer{font-size:20px;font-weight:700}
.timer.low{color:#c0392b}
.bar{height:8px;background:#e3e8f2;border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:#1f4e9c}
.err{color:#c0392b;font-size:13px;margin-top:6px;min-height:16px}
.qtext{font-size:18px;line-height:1.6;white-space:pre-line;margin:14px 0}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{padding:8px;border-bottom:1px solid #e3e8f2;text-align:start}
.disc{font-size:12px;color:#5b6577;margin-top:16px;line-height:1.5}
.brand{font-size:12px;color:#5b6577;margin-bottom:6px}
/* PHOTO_DATA_URI */
/* ---- Canva design system: light blue-grey page, centered white card, brand blue ---- */
body{background:#eef3fa;min-height:100vh}
.card{max-width:640px;border-radius:16px;padding:32px 36px;box-shadow:0 10px 30px rgba(31,78,156,.12)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:#1f4e9c;font-size:16px;margin-bottom:14px}
.logo .dot{width:22px;height:22px;border-radius:50%;background:#1f4e9c;display:inline-block}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps span{flex:1;height:4px;border-radius:2px;background:#dfe6f2}
.steps span.on{background:#1f4e9c}
.step-label{font-size:13px;color:#1f4e9c;font-weight:600;margin-bottom:10px}
h1{text-align:center;font-size:24px}
.sub{text-align:center;color:#5b6577;margin:0 0 18px}
.row3,.row2{display:grid;gap:12px}
.row3{grid-template-columns:1fr 1fr 1fr}
.row2{grid-template-columns:1fr 1fr}
.row3>div,.row2>div{min-width:0}
input,select{border-radius:10px;border-color:#d5dce8}
button.primary{width:100%;padding:14px;font-size:16px;margin-top:18px;border-radius:10px;background:#1f4e9c}
.secure{text-align:center;font-size:12px;color:#5b6577;margin-top:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qmeta{font-size:13px;color:#5b6577;margin-bottom:6px}
.timer{background:#e8f0fc;color:#1f4e9c;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;min-width:70px;text-align:center}
.timer.low{background:#fdecea;color:#c0392b}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #dfe6f2;border-radius:12px;padding:14px 16px;margin:10px 0}
.opt:hover:not(:disabled){border-color:#1f4e9c}
.opt.sel{border-color:#1f4e9c;background:#eef4ff;box-shadow:0 0 0 3px rgba(31,78,156,.12)}
.ltr{width:28px;height:28px;border-radius:8px;background:#eef3fa;color:#1f4e9c;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px}
.hint{font-size:13px;color:#5b6577;min-height:18px}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap}
@media (max-width:620px){.row3{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.card{padding:22px}}
.stats{display:flex;gap:12px;margin-bottom:0}
.stats>div{flex:1;text-align:center;padding:14px;background:#f0f4fb;border-radius:10px}
.stats b{display:block;font-size:26px;color:#1f4e9c}
.stats span{font-size:13px;color:#4a5568}
.consent{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:16px 0 8px;font-size:13px;line-height:1.5}
.consent input{width:auto;margin-top:3px}
.pay-note{font-size:13px;color:#4a5568}
.langbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;max-width:720px;margin:16px auto 0;padding:0 2px}
.langbar .globe{display:flex;color:#1f4e9c}
.langbar button{background:#fff;color:#1f4e9c;border:1px solid #c9d1df;border-radius:8px;padding:6px 12px;font-size:13px}
.langbar button.on{background:#1f4e9c;color:#fff;border-color:#1f4e9c}
.stats .ic{display:flex;justify-content:center;color:#1f4e9c;margin-bottom:6px}
.elapsed-wrap{font-size:14px;color:#4a5568}
.elapsed-wrap b{color:#1f4e9c;font-variant-numeric:tabular-nums}
.rvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:12px 0}.rv{padding:8px 0;border:0;border-radius:6px;font-weight:600;color:#fff;cursor:pointer}.rv:disabled{opacity:.35;cursor:default}.rv.done{background:#2e7d4f}.rv.flagged{background:#d98e04}.rv.expired{background:#c0392b}.rv.todo{background:#8a94a6}
</style>
</head>

const ABIL = ['num','pat','verb','logic','vis'];
const TOTAL = 50, SECONDS = 30;
let LANG = 'en';
let EXAM = 'en';   // language of the questions, chosen in the form
const ST = {};            // test state

/* ---------- helpers (display only) ---------- */
const tx=(en,ar)=> EXAM==='ar' ? ar : en;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- registration ---------- */
function readReg(){
  const g=id=>{const el=document.getElementById(id); return el?el.value.trim():(ST.reg?ST.reg[id]:'');};
  return {name:g('f_name'), gender:g('f_gender'), birth:g('f_birth'), lang:g('f_lang')||'en', phone:g('f_phone'), email:g('f_email')};
}
function renderReg(err, keep){
  const u=UI[LANG];
  const v=keep||{};
  const langOpts=[['en','English'],['ar','العربية'],['fr','Français']].map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>${n}</option>`).join('');
  document.getElementById('app').innerHTML=`
    <div class="logo">${CONFIG.photo?`<img src="${CONFIG.photo}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`:'<span class="dot"></span>'}${esc(CONFIG.brand||'')}</div>

    <label>${u.name}</label><input id="f_name" value="${esc(v.name||'')}">
    <div class="row3">
      <div><label>${u.gender}</label><select id="f_gender"><option value="male" ${v.gender==='male'?'selected':''}>${u.male}</option><option value="female" ${v.gender==='female'?'selected':''}>${u.female}</option></select></div>
      <div><label>${u.birth}</label><input id="f_birth" type="date" value="${esc(v.birth||'')}"></div>

    </div>

}
function changeLang(l){ LANG=l; refreshStatLabels(); document.documentElement.lang=l; document.documentElement.dir=UI[l].dir; renderReg(null, readReg()); }
function submitReg(){
  const r=readReg(); const u=UI[LANG];
  let err='';
  if(r.name.length<3 || !r.gender || !r.birth) err=u.reqErr;
  else if(!document.getElementById('f_consent').checked) err=u.consentErr;
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) err=u.emailErr;
  else if(!/^\+?[0-9\s-]{7,20}$/.test(r.phone)) err=u.phoneErr;
  if(err){ document.getElementById('f_err').textContent=err; return; }
  ST.reg=r; EXAM=r.lang;
  startTest();
}

Object.assign(UI.en,{flag:'Mark for later', unflag:'Unmark', review:'Review questions', flagged:'Marked for later', answeredCount:'Answered', rvLegend:'Green = answered, orange = marked for later, red = time expired, grey = not answered. Click a number to go back to it.', backToQ:'Back to question'});
Object.assign(UI.ar,{flag:'وضع علامة للمراجعة', unflag:'إلغاء العلامة', review:'مراجعة الأسئلة', flagged:'معلّم للمراجعة', answeredCount:'تمت الإجابة', rvLegend:'أخضر = تمت الإجابة، برتقالي = معلّم للمراجعة، أحمر = انتهى الوقت، رمادي = لم تتم الإجابة. اضغط رقم السؤال للعودة إليه.', backToQ:'العودة إلى السؤال'});
Object.assign(UI.fr,{flag:'Marquer pour plus tard', unflag:'Retirer le marquage', review:'Revoir les questions', flagged:'Marquée pour plus tard', answeredCount:'Répondues', rvLegend:'Vert = répondue, orange = marquée, rouge = temps écoulé, gris = sans réponse. Cliquez un numéro pour y revenir.', backToQ:'Retour à la question'});
function toggleFlag(){ if(ST.done) return; const i=ST.idx; ST.flag[i]=!ST.flag[i];
  if(ST.flag[i]) ST.deadline[i]=null;
  else if(!ST.locked[i] && ST.ans[i]===null) ST.deadline[i]=Date.now()+SECONDS*1000;
  renderQ(); }
function showReview(){
  if(ST.done) return;
  ST.review=true; const u=UI[LANG];
  const cells=ST.items.map((_,k)=>{
    const visited=k<=(ST.furthest||0);
    const cls=ST.flag[k]?'flagged':(ST.ans[k]!==null?'done':(ST.locked[k]?'expired':'todo'));
    return '<button class="rv '+cls+'" '+(visited?'':'disabled')+' onclick="goFromReview('+k+')">'+(k+1)+'</button>';
  }).join('');
  const answered=ST.ans.filter(a=>a!==null).length;
  const flagged=ST.flag.filter(Boolean).length;
  document.getElementById('app').innerHTML=`
    <div class="qhead"><div class="logo"><span class="dot"></span>${esc(CONFIG.brand||'')}</div>
      <span class="elapsed-wrap"><span class="elapsed-label">Elapsed</span> <b id="elapsed">00:00</b></span></div>
    <h3>${u.review}</h3>
    <p class="hint">${u.answeredCount}: ${answered} / ${TOTAL} · ${u.flagged}: ${flagged}</p>
    <div class="rvgrid">${cells}</div>
    <p class="hint">${u.rvLegend}</p>
    <div class="nav">
      <button class="ghost" onclick="renderQ()">${u.backToQ}</button>
      <button class="ghost" onclick="finish()">${u.finish}</button>
    </div>`;
  updateTimer();
}
function goFromReview(k){ ST.idx=k; renderQ(); }
/* ---------- test flow ---------- */
async function startTest(){
  hideStats();
  let t;
  try{
    const r=await fetch(CONFIG.apiBase+'/start-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:EXAM})});
    t=await r.json();
    if(!r.ok||!t.testId) throw new Error(t.error||'start failed');
  }catch(e){ document.getElementById('app').innerHTML='<p class="err">'+esc(e.message)+'</p>'; return; }
  ST.testId=t.testId;
  ST.items=t.questions;                       // stems and options only; answers stay on the server
  ST.ans=Array(TOTAL).fill(null); ST.locked=Array(TOTAL).fill(false); ST.flag=Array(TOTAL).fill(false); ST.deadline=Array(TOTAL).fill(null);
  ST.review=false; ST.idx=0; ST.tabSwitches=0; ST.done=false; ST.startedAt=Date.now();
  ST.endAt=Date.now()+t.seconds*1000;         // one countdown for the whole test
  go(0);
  ST.timer=setInterval(tick,250);
}
function go(j){
  ST.furthest=Math.max(ST.furthest||0,j);
  ST.idx=j;
  renderQ();
}
function renderQ(){
  ST.review=false;
  const u=UI[LANG]; const i=ST.idx; const it=ST.items[i]; const locked=ST.locked[i];
  const opts=it.options.map((o,j)=>`<button class="opt ${ST.ans[i]===j?'sel':''}" ${locked?'disabled':''} onclick="choose(${j})"><span class="ltr">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('');
  document.getElementById('app').innerHTML=`
    <div class="qhead"><div class="logo">${CONFIG.photo?`<img src="${CONFIG.photo}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover">`:'<span class="dot"></span>'}${esc(CONFIG.brand||'')}</div>
      <span class="elapsed-wrap"><span class="elapsed-label">Elapsed</span> <b id="elapsed">00:00</b></span> <span id="timer" class="timer"></span></div>
    <div class="qmeta">${u.question} ${i+1} ${u.of} ${TOTAL}</div>
    <div class="bar"><div style="width:${(i+1)/TOTAL*100}%"></div></div>
    <div class="qtext">${esc(it.stem)}</div>
    ${opts}
    <p class="hint">${locked?u.timeUp:u.hint}</p>
    <div class="nav">
      <button class="ghost" ${i===0?'disabled':''} onclick="go(${i-1})">${u.prev}</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost" onclick="finish()">${u.finish}</button>
        <button ${i===TOTAL-1?'disabled':''} onclick="go(${i+1})">${u.next}</button>
      </div>
    </div>`;
  updateTimer();
}
function choose(j){ if(ST.done || ST.locked[ST.idx]) return; ST.ans[ST.idx]=j; renderQ(); }
function updateTimer(){
  const ex=document.getElementById('elapsed');
  if(ex && ST.startedAt){ const e=Math.floor((Date.now()-ST.startedAt)/1000); ex.textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0'); }
  const el=document.getElementById('timer'); if(!el || !ST.endAt) return;
  const rem=Math.max(0,Math.ceil((ST.endAt-Date.now())/1000));
  el.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
  el.className='timer'+(rem<=60?' low':'');
}
function tick(){
  if(ST.done) return;
  if(Date.now()>=ST.endAt){ finish(); return; }   // time is up: submit the answers given so far
  updateTimer();
}
function finish(){
  if(ST.done) return;
  ST.done=true; clearInterval(ST.timer);
  submitForPayment({reg:ST.reg, lang:EXAM, testId:ST.testId, answers:ST.ans});
}

/* ---------- scoring & report ---------- */
function bandFor(iq){
  const bands=(CONFIG.jobBands||[]).slice().sort((a,b)=>b.minIQ-a.minIQ);
  return bands.find(b=>iq>=b.minIQ) || null;
}
function reportHTML(lang, res){
  const u=UI[lang]||UI.en;
  const rows=ABIL.map(a=>{ const p=res.per[a].n?Math.round(res.per[a].c/res.per[a].n*100):0; return `<tr><td>${u.ab[a]}</td><td>${res.per[a].c} / ${res.per[a].n}</td><td>${p}%</td></tr>`; }).join('');
  const strong=ABIL.filter(a=>res.per[a].n && res.per[a].c/res.per[a].n>=0.8).map(a=>u.ab[a]);
  const weak=ABIL.filter(a=>res.per[a].n && res.per[a].c/res.per[a].n<=0.5).map(a=>u.ab[a]);
  const band=bandFor(res.iq);
  const job=band?(band[lang]||band.en):'';
  return `<div dir="${u.dir}" style="font-family:system-ui,Arial,sans-serif;color:#1d2433">
    <h2>${u.rTitle}</h2>
    <p><b>${u.candidate}:</b> ${esc(res.reg.name)}<br><b>Date:</b> ${res.date}<br><b>Email:</b> ${esc(res.reg.email)} · <b>Phone:</b> ${esc(res.reg.phone)}</p>
    <p><b>${u.score}:</b> ${res.correct} / ${res.total} &nbsp; <b>${u.pct}:</b> ${res.pct}%</p>
    <p><b>${u.estimate}:</b> ${res.iq} &nbsp; <b>${u.pctl}:</b> ${res.pctl}</p>
    <h2>${u.abil}</h2>
    <table><tr><th>${u.abil}</th><th>${u.score}</th><th>${u.pct}</th></tr>${rows}</table>
    <p><b>${u.strong}:</b> ${strong.length?strong.join(', '):u.none}<br><b>${u.weak}:</b> ${weak.length?weak.join(', '):u.none}</p>
    <p><b>${u.jobs}:</b> ${esc(job)}</p>
    <p><b>${u.timeouts}:</b> ${res.timeouts} &nbsp; <b>${u.unanswered}:</b> ${res.unanswered} &nbsp; <b>${u.tabs}:</b> ${res.tabSwitches}</p>
    <p class="disc">${u.disc}</p>
  </div>`;
}
function renderReport(res){
  const full=reportHTML('en',res) + (LANG!=='en' ? '<hr>'+reportHTML(LANG,res) : '');
  ST.report=full; ST.result=res;
  const u=UI[LANG];
  document.getElementById('app').innerHTML=`
    <h1>${u.rTitle}</h1>
    ${full}
    <p><button onclick="downloadReport()">${u.download}</button></p>
    <div class="err" id="mail_status" style="color:#1d2433"></div>`;
  sendReport(full, res);
}
function downloadReport(){
  const blob=new Blob(['<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>'+ST.report+'</body></html>'],{type:'text/html'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='report_'+(ST.reg.name||'candidate').replace(/\s+/g,'_')+'.html'; a.click();
}
async function sendReport(html, res){
  const el=document.getElementById('mail_status'); if(!el) return;
  if(!CONFIG.webhookUrl){ el.textContent=''; return; }
  el.textContent=UI[LANG].sending;
  try{
    const payload={to:res.reg.email, cc:CONFIG.ccEmail||'', subject:'Test result - '+res.reg.name, reportHtml:html,
      candidate:res.reg, score:{correct:res.correct,total:res.total,pct:res.pct,estimate:res.iq,percentile:res.pctl}, timeouts:res.timeouts, tabSwitches:res.tabSwitches};
    await fetch(CONFIG.webhookUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    el.textContent=UI[LANG].sent;
  }catch(e){ el.textContent=UI[LANG].sendFail; }
}

/* ---------- integrity signals ---------- */
if(typeof document!=='undefined'){
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && ST.items && !ST.done) ST.tabSwitches++; });
  ['copy','cut','paste','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{ if(ST.items && !ST.done) e.preventDefault(); }));
}

function hideStats(){ for(const id of ['stats','langbar']){ const el=document.getElementById(id); if(el) el.style.display='none'; } }
async function trackVisit(){
  try{ await fetch(CONFIG.apiBase+'/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:navigator.language||''})}); }catch(e){}
}

  refreshStatLabels();
  try{
    const r=await fetch(CONFIG.apiBase+'/stats'); const j=await r.json();
    document.getElementById('st_v').textContent=j.visitors;
    document.getElementById('st_s').textContent=j.submitted;
  }catch(e){}
}
function summaryOf(res){
  return {correct:res.correct,total:res.total,pct:res.pct,iq:res.iq,pctl:res.pctl,per:res.per,
    unanswered:res.unanswered,timeouts:res.timeouts,tabSwitches:res.tabSwitches,elapsed:res.elapsed,date:res.date};
}
async function submitForPayment(sub){
  const u=UI[LANG]||UI.en; const app=document.getElementById('app');
  app.innerHTML=`<h1>${u.rTitle}</h1><p class="pay-note">${u.paying}</p>`;
  try{
    const r=await fetch(CONFIG.apiBase+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({reg:sub.reg, lang:sub.lang, testId:sub.testId, answers:sub.answers})});
    const j=await r.json();
    if(!r.ok || !j.paymentUrl) throw new Error(j.error||'submit failed');
    sessionStorage.setItem('iq_sid', j.submissionId);   // used after the payment returns to this page
    location.href=j.paymentUrl;
  }catch(e){
    app.innerHTML=`<h1>${u.rTitle}</h1><p class="err">${u.payFail}</p><button onclick="location.reload()">${u.again}</button>`;
  }
}
async function showPaymentReturn(){
  const u=UI[LANG]||UI.en; const app=document.getElementById('app');
  const q=new URLSearchParams(location.search); const sid=sessionStorage.getItem('iq_sid');
  hideStats();
  if(q.get('success')!=='true'){
    app.innerHTML=`<h1>${u.rTitle}</h1><p class="err">${u.payNotDone}</p><button onclick="location.href=location.pathname">${u.again}</button>`; return;
  }
  if(!sid){ app.innerHTML=`<h1>${u.rTitle}</h1><p>${u.payPending}</p>`; return; }
  app.innerHTML=`<h1>${u.rTitle}</h1><p class="pay-note">${u.waiting}</p>`;
  for(let i=0;i<40;i++){                       // the payment webhook may arrive a few seconds after the redirect
    try{
      const r=await fetch(CONFIG.apiBase+'/result?sid='+encodeURIComponent(sid)); const j=await r.json();
      if(j.status==='paid'){
        ST.report=j.reportHtml; ST.reg={name:j.name||'candidate'};
        app.innerHTML=`<p class="pay-note">✔ ${u.payDone}</p>${j.reportHtml}<p><button onclick="downloadReport()">${u.download}</button></p>`;
        sessionStorage.removeItem('iq_sid'); return;
      }
    }catch(e){}
    await new Promise(done=>setTimeout(done,3000));
  }
  app.innerHTML=`<h1>${u.rTitle}</h1><p>${u.payPending}</p>`;
}

/* ---------- init ---------- */
if(typeof document!=='undefined' && document.getElementById('app')){
  document.documentElement.dir=UI[LANG].dir;
  trackVisit(); loadStats(); updateLangButtons();
  if(new URLSearchParams(location.search).get('payment')==='return') showPaymentReturn();
  else renderReg();
}
</script>
</body>
</html>
