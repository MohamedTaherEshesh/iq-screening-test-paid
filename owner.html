<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner - Payments</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#F2F4F7;color:#1D2939}
  .wrap{max-width:820px;margin:32px auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h1{color:#0B1F3A;font-size:24px;margin:0 0 6px}
  .muted{color:#667085;font-size:14px}
  input{padding:10px;font-size:16px;border:1px solid #D0D5DD;border-radius:8px;width:260px}
  button{padding:10px 18px;font-size:16px;background:#0B1F3A;color:#fff;border:0;border-radius:8px;cursor:pointer;margin-left:8px}
  table{border-collapse:collapse;width:100%;margin:12px 0 24px}
  th,td{padding:10px 12px;border-bottom:1px solid #E4E7EC;text-align:left;font-size:15px}
  th.r,td.r{text-align:right}
  h2{color:#0B1F3A;font-size:18px;margin:24px 0 4px}
  .err{color:#B42318;margin-top:12px}
  .strong{font-weight:600;color:#00A6A6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Payments</h1>
  <p class="muted">Owner only. Enter your passcode to see totals.</p>
  <div>
    <input id="pc" type="password" placeholder="Passcode" autocomplete="current-password">
    <button id="go">Show</button>
  </div>
  <div id="err" class="err"></div>
  <div id="out"></div>
</div>
<script src="./staging-config.js"></script>
<script>
// Development safety: never connect this page to the live Supabase project.
const STAGING_API = String(window.OMSAZE_STAGING_API_BASE || "").replace(new RegExp("/$"), "");
let stagingReady = false;
try {
  const u = new URL(STAGING_API);
  stagingReady = u.protocol === "https:" && u.hostname.endsWith(".supabase.co")
    && u.hostname !== "trfmircskunoszetgfjt.supabase.co"
    && u.pathname === "/functions/v1";
} catch (_) {}
if (!stagingReady) {
  document.getElementById("err").textContent =
    "Development mode: configure a separate Supabase Staging URL in staging-config.js before using payments.";
  document.getElementById("go").disabled = true;
}
const API = stagingReady ? STAGING_API : "";
const money = b => b.egp.toFixed(2) + " EGP";
const row = (label, b) => `<tr><td>${label}</td><td class="r">${b.count}</td><td class="r strong">${money(b)}</td></tr>`;

document.getElementById("go").onclick = load;
document.getElementById("pc").addEventListener("keydown", e => { if (e.key === "Enter") load(); });

async function load() {
  if (!stagingReady) return;
  const err = document.getElementById("err"), out = document.getElementById("out");
  err.textContent = ""; out.innerHTML = "";
  const passcode = document.getElementById("pc").value;
  try {
    const r = await fetch(API + "/owner-totals", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ passcode })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = r.status === 401 ? "Wrong passcode." : "Could not load totals. Try again."; return; }
    const t = d.totals;
    const hours = Object.keys(t.hours).sort();
    out.innerHTML = `
      <h2>Totals (as of ${t.today})</h2>
      <table>
        <tr><th>Period</th><th class="r">Payments</th><th class="r">Amount</th></tr>
        ${row("Today", t.day)}${row("Week to date", t.week)}${row("Month to date", t.month)}${row("Year to date", t.year)}${row("Inception to date", t.inception)}
      </table>
      <h2>Today by hour</h2>
      <table>
        <tr><th>Hour</th><th class="r">Payments</th><th class="r">Amount</th></tr>
        ${hours.length ? hours.map(h => row(h + ":00 - " + h + ":59", t.hours[h])).join("") : '<tr><td colspan="3">No payments yet today.</td></tr>'}
      </table>
      <h2>Latest payments</h2>
      <table>
        <tr><th>Name</th><th>Paid at</th><th class="r">Amount</th></tr>
        ${d.recent.length ? d.recent.map(p => `<tr><td>${esc(p.name)}</td><td>${new Date(p.paid_at).toLocaleString()}</td><td class="r">${(p.amount_cents/100).toFixed(2)} EGP</td></tr>`).join("") : '<tr><td colspan="3">No payments yet.</td></tr>'}
      </table>`;
  } catch (e) {
    err.textContent = "Could not reach the server. Check your internet connection.";
  }
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
</script>
</body>
</html>
