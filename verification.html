<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OMSAZE — تأكيد الإيميل قبل الامتحان</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#193351;background:#f0f4fa}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;background:white;padding:20px max(20px,7vw);border-bottom:1px solid #dfe6f0}.brand{font-size:25px;font-weight:800;letter-spacing:2px;color:#1f4e9c;display:flex;align-items:center;gap:1px}.omega{font-size:32px;line-height:1}button,input{font:inherit}button{background:#1f4e9c;border:1px solid #1f4e9c;border-radius:9px;padding:12px 18px;color:white;min-height:46px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:white;color:#1f4e9c;border-color:#c9d5e8}main{max-width:860px;margin:35px auto;padding:0 18px}.steps{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0;color:#8a98aa;font-size:12px}.steps span{border-radius:20px;padding:8px 13px;background:#e6edf6}.steps .on{background:#d5e4fa;color:#1f4e9c}section{background:white;border:1px solid #dce4ef;border-radius:16px;padding:32px;box-shadow:0 8px 28px #203c6410}h1{font-size:29px;margin:8px 0 17px}p{font-size:14px;line-height:1.9;color:#64758a}.eyebrow{font-size:10px;letter-spacing:2px;color:#6380a3}.note{background:#f0f5fc;border-inline-start:3px solid #5d87c2;border-radius:6px;padding:15px 18px;line-height:1.9;font-size:13px;margin:20px 0}.pending{background:#fff9ed;border-color:#c3a164;color:#8f7750}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metric{padding:18px;background:#f6f8fc;border-radius:10px}.metric strong{font-size:27px;display:block;color:#1f4e9c}.metric small{color:#778ba2}label{display:block;font-size:13px;line-height:1.9;margin-top:18px}input{width:100%;padding:13px;border:1px solid #cbd7e7;border-radius:8px;margin:8px 0 10px;min-height:46px}input[type=checkbox]{width:auto;min-height:0;margin-inline-end:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.error{color:#ae493e;background:#fff1ed;padding:13px;border-radius:7px;font-size:13px;line-height:1.8}.timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}.small{font-size:11px;color:#8495a9}.success{color:#19805d}.code{letter-spacing:12px;font-size:25px;text-align:center;direction:ltr}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}footer{font-size:11px;color:#8a9aad;line-height:1.9;margin:22px 0}button:focus-visible,input:focus-visible{outline:3px solid #99bdec;outline-offset:3px}@media(max-width:560px){main{margin-top:20px}section{padding:23px 20px}h1{font-size:25px}header{padding:16px 20px}.fields{gap:10px}.metric{padding:13px}.actions button{flex:1}.code{letter-spacing:7px}}
</style></head><body><header><div class="brand" dir="ltr" aria-label="OMSAZE"><span class="omega">Ω</span>MSAZE</div><button id="toggle" class="ghost">English</button></header><main><div class="steps" id="steps"></div><section id="content"></section><footer id="footer"></footer></main><script src="verification-config.js"></script><script type="module" src="verification-page.js"></script></body></html>
