<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#102D46">
<title>Free demo | OMSAZE MindProof</title>
<!-- OMS-MND-261126-09 (owner revision 16:38Z): Demo button per exam. 5 questions per demo, at most 2 demos per
     person on this browser (counter in localStorage, resets after 24 hours), final score only, no certificate,
     no payment, nothing sent to the server.
     The 10 questions are written only for this demo; they are NOT taken from the exam question bank,
     so real exam items stay private. Everything runs in the browser; no network call is made. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./omsaze-brand.css">
<style>
:root{--navy:#102D46;--gold:#9A7A35;--muted:#667085;--line:#dfe6ee;--ok:#0f7b4c;--bad:#b42318;--soft:#eef2f9}
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:var(--navy);font-family:"Source Sans 3","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16.5px}
[dir=rtl] main{font-family:"IBM Plex Sans Arabic","Source Sans 3",Tahoma,Arial,sans-serif}
main{max-width:780px;margin:auto;padding:36px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase;margin:0}
h1{font-family:Manrope,"IBM Plex Sans Arabic",sans-serif;font-size:clamp(28px,5vw,40px);line-height:1.2;margin:10px 0 8px}
p{color:var(--muted);line-height:1.7}
.btn{font:inherit;font-weight:700;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.langbtn{font:inherit;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 14px;color:var(--navy);cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin:18px 0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:6px;margin:10px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.tag{display:inline-block;background:var(--soft);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}
.q{font-size:19px;font-weight:600;line-height:1.6;margin:14px 0 6px}
.note{font-size:14px;color:var(--muted);margin:0 0 10px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{font:inherit;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;color:var(--navy)}
.opt:hover{border-color:#9fb0c6}.opt[aria-pressed=true]{border-color:var(--navy);background:#f4f7fb;font-weight:600}
.opt.right{border-color:var(--ok);background:#e7f6ee}.opt.wrong{border-color:var(--bad);background:#fdecea}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:8px}
.score{font-family:Manrope,sans-serif;font-size:46px;font-weight:800;margin:6px 0}
.review li{margin:0 0 14px;line-height:1.6}.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.fine{font-size:13.5px}
</style>
</head>
<body>
<main id="app"></main>
<script src="./university-config.js"></script>
<script>
(function () {
  'use strict';
  // OMS-MND-261126-10: questions, correct answers, scoring and the 2-demo limit all live in the database
  // (functions demo_status / demo_start / demo_submit). The browser never receives the correct answers.
  var T = {
    eyebrow: ['OMSAZE MindProof · Free demo', 'OMSAZE MindProof · تجربة مجانية'],
    title: ['Free demo: 5 questions', 'تجربة مجانية: 5 أسئلة'],
    lead: ['5 sample questions in the same style as the real exam. No payment and no certificate. Each verified email can take the demo up to 2 times per exam.', '5 أسئلة نموذجية بنفس شكل الاختبار الحقيقي. بدون دفع وبدون شهادة. كل بريد إلكتروني موثق له تجربتان بحد أقصى لكل اختبار.'],
    left: ['Demos left: {n} of 2', 'التجارب المتبقية: {n} من 2'],
    usedUp: ['You have used both free demos for this exam. Start the full exam when you are ready.', 'لقد استخدمت التجربتين المجانيتين لهذا الاختبار. ابدأ الاختبار الكامل عندما تكون جاهزا.'],
    signIn: ['To take the demo, first verify your email on the exam page (the same step as the real exam). Then come back to the exams list and press Demo.', 'لأداء التجربة، وثّق بريدك الإلكتروني أولا من صفحة الاختبار (نفس خطوة الاختبار الحقيقي). ثم ارجع لقائمة الاختبارات واضغط زر التجربة.'],
    verify: ['Verify my email', 'توثيق البريد الإلكتروني'],
    examName: ['Exam: {e}', 'الاختبار: {e}'],
    start: ['Start the demo', 'ابدأ التجربة'], lang: ['العربية', 'English'], loading: ['Loading…', 'جار التحميل…'],
    of: ['Question {n} of {t}', 'السؤال {n} من {t}'], next: ['Next', 'التالي'], back: ['Back', 'السابق'], finish: ['See my result', 'اعرض نتيجتي'],
    enOnly: ['', 'هذا السؤال لقياس مهارة اللغة الإنجليزية، لذلك يظهر بالإنجليزية.'],
    result: ['Your demo result', 'نتيجة التجربة'], correct: ['correct', 'إجابات صحيحة'],
    resultNote: ['Final demo score. This is practice only: no certificate and no percentile. The full exam has 70 questions in 7 areas.', 'النتيجة النهائية للتجربة. للتدريب فقط: بدون شهادة ولا ترتيب مئيني. الاختبار الكامل فيه 70 سؤالا في 7 مجالات.'],
    error: ['Something went wrong. Please try again.', 'حدث خطأ. حاول مرة أخرى.'],
    again: ['Second demo', 'التجربة الثانية'], full: ['Start the full exam', 'ابدأ الاختبار الكامل'], back2: ['Back to exams', 'العودة للاختبارات']
  };
  var params = new URLSearchParams(location.search);
  var ar = params.get('lang') === 'ar' || (!params.get('lang') && /^ar\b/i.test(navigator.language || ''));
  var EXAMS = { 'university-iq-preparation': ['MindProof Reasoning Score for Universities', 'مؤشر MindProof للاستدلال للجامعات', './iq-prep.html'],
                'university-cognitive-skills': ['Cognitive Assessment for Universities', 'التقييم المعرفي للجامعات', './university.html'] };
  var exam = EXAMS[params.get('exam')] ? params.get('exam') : 'university-iq-preparation';
  var cfg = window.OMSAZE_ADVANCED70_CONFIG || {}, REST = String(cfg.apiBase || '').replace('/functions/v1', '');
  var SKEY = 'omsaze-email-verification';
  function auth() { try { return JSON.parse(sessionStorage.getItem(SKEY) || 'null') || {}; } catch (e) { return {}; } }
  function signedIn() { var a = auth(); return !!(a.proof && a.session && a.session.access_token); }
  async function refresh() {
    var a = auth(); if (!a.session || !a.session.refresh_token) throw Error('sign_in_required');
    var r = await fetch(REST + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { 'content-type': 'application/json', apikey: cfg.publishableKey }, body: JSON.stringify({ refresh_token: a.session.refresh_token }) });
    var d = await r.json(); if (!r.ok || !d.access_token) throw Error('sign_in_required');
    a.session = { access_token: d.access_token, refresh_token: d.refresh_token || a.session.refresh_token, expires_at: d.expires_at };
    try { sessionStorage.setItem(SKEY, JSON.stringify(a)); } catch (e) {}
  }
  async function rpc(fn, body, retried) {
    var a = auth(); if (!a.session || !a.session.access_token) throw Error('sign_in_required');
    var r = await fetch(REST + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'content-type': 'application/json', apikey: cfg.publishableKey, authorization: 'Bearer ' + a.session.access_token }, body: JSON.stringify(body), signal: AbortSignal.timeout(15000) });
    var d = null; try { d = await r.json(); } catch (e) {}
    if (r.ok) return d;
    var msg = (d && (d.message || d.error)) || ('HTTP ' + r.status);
    if ((r.status === 401 || /JWT/i.test(msg)) && !retried) { await refresh(); return rpc(fn, body, true); }
    throw Error(msg);
  }
  var state = 'intro', status = null, Q = [], runId = null, ans = [], i = 0, res = null, busy = false, err = '';
  var L = function () { return ar ? 1 : 0; };
  var t = function (k) { return T[k][L()]; };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var app = document.getElementById('app');
  function fail(e) { var m = String(e && e.message || e); busy = false;
    if (/sign_in_required/.test(m)) { state = 'signin'; } else if (/demo_limit_reached/.test(m)) { status = { remaining: 0 }; state = 'intro'; } else { err = t('error'); }
    render(); }
  async function loadStatus() { if (!signedIn()) { state = 'signin'; render(); return; }
    try { status = await rpc('demo_status', { p_exam_tag: exam }); state = 'intro'; render(); } catch (e) { fail(e); } }
  async function begin() { if (busy) return; busy = true; err = ''; render();
    try { var d = await rpc('demo_start', { p_exam_tag: exam }); runId = d.runId; Q = d.questions || []; status = { remaining: d.remaining };
      ans = new Array(Q.length).fill(null); i = 0; state = 'quiz'; busy = false; render(); } catch (e) { fail(e); } }
  async function submit() { if (busy) return; busy = true; err = ''; render();
    try { res = await rpc('demo_submit', { p_run_id: runId, p_answers: ans }); status = { remaining: res.remaining }; state = 'result'; busy = false; render(); window.scrollTo(0, 0); } catch (e) { fail(e); } }
  function head() {
    return '<div class="top"><p class="eyebrow">' + esc(t('eyebrow')) + '</p><button class="langbtn" id="lang" type="button">' + esc(t('lang')) + '</button></div>';
  }
  function fullLink(cls) { return '<a class="btn' + (cls || '') + '" href="' + EXAMS[exam][2] + '?lang=' + (ar ? 'ar' : 'en') + '">' + esc(t('full')) + '</a>'; }
  function render() {
    document.documentElement.lang = ar ? 'ar' : 'en'; document.documentElement.dir = ar ? 'rtl' : 'ltr';
    var h = head();
    if (state === 'signin') {
      h += '<h1>' + esc(t('title')) + '</h1><p><span class="tag">' + esc(t('examName').replace('{e}', EXAMS[exam][L()])) + '</span></p><div class="card"><p>' + esc(t('signIn')) + '</p>' +
        '<a class="btn" href="' + EXAMS[exam][2] + '?lang=' + (ar ? 'ar' : 'en') + '">' + esc(t('verify')) + '</a></div>';
    } else if (state === 'intro') {
      h += '<h1>' + esc(t('title')) + '</h1><p><span class="tag">' + esc(t('examName').replace('{e}', EXAMS[exam][L()])) + '</span></p><p>' + esc(t('lead')) + '</p>';
      if (!status) h += '<p class="fine">' + esc(t('loading')) + '</p>';
      else if (status.remaining <= 0) h += '<div class="card"><p>' + esc(t('usedUp')) + '</p>' + fullLink() + '</div>';
      else h += '<p class="fine">' + esc(t('left').replace('{n}', status.remaining)) + '</p><button class="btn" id="start" type="button"' + (busy ? ' disabled' : '') + '>' + esc(busy ? t('loading') : t('start')) + '</button>';
    } else if (state === 'quiz') {
      var q = Q[i], en = q.englishOnly, li = en ? 0 : L();
      h += '<div class="card"><div class="meta"><span>' + esc(t('of').replace('{n}', i + 1).replace('{t}', Q.length)) + '</span><span class="tag">' + esc(q.domain[L()]) + '</span></div>' +
        '<div class="bar"><i style="width:' + Math.round((i + 1) * 100 / Q.length) + '%"></i></div>' +
        (en && ar ? '<p class="note">' + esc(t('enOnly')) + '</p>' : '') +
        '<div class="q' + (en ? ' ltr' : '') + '">' + esc(q.question[li]) + '</div><div class="opts' + (en ? ' ltr' : '') + '">';
      q.options.forEach(function (o, k) { h += '<button class="opt" type="button" data-k="' + k + '" aria-pressed="' + (ans[i] === k) + '">' + esc(li ? o.ar : o.en) + '</button>'; });
      h += '</div><div class="row"><button class="btn ghost" id="back" type="button"' + (i === 0 ? ' disabled' : '') + '>' + esc(t('back')) + '</button>' +
        '<button class="btn" id="next" type="button"' + (ans[i] === null || busy ? ' disabled' : '') + '>' + esc(i === Q.length - 1 ? (busy ? t('loading') : t('finish')) : t('next')) + '</button></div></div>';
    } else {
      var left = status ? status.remaining : 0;
      h += '<div class="card"><h1>' + esc(t('result')) + '</h1><div class="score ltr">' + res.score + ' / ' + res.total + '</div><p>' + esc(t('correct')) + '</p><p class="fine">' + esc(t('resultNote')) + '</p>' +
        '<p class="fine">' + esc(t('left').replace('{n}', left)) + '</p><div class="row">' +
        (left > 0 ? '<button class="btn ghost" id="again" type="button">' + esc(t('again')) + '</button>' : '<a class="btn ghost" href="./index.html?lang=' + (ar ? 'ar' : 'en') + '">' + esc(t('back2')) + '</a>') +
        fullLink() + '</div></div>';
    }
    if (err) h += '<p class="note" role="alert">' + esc(err) + '</p>';
    app.innerHTML = h;
    bind();
  }
  function bind() {
    var on = function (id, f) { var el = document.getElementById(id); if (el) el.addEventListener('click', f); };
    on('lang', function () { ar = !ar; render(); });
    on('start', begin);
    on('again', begin);
    on('back', function () { if (i > 0) { i--; render(); } });
    on('next', function () { if (ans[i] === null) return; if (i < Q.length - 1) { i++; render(); window.scrollTo(0, 0); } else submit(); });
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) {
      b.addEventListener('click', function () { ans[i] = Number(b.getAttribute('data-k')); render(); });
    });
  }
  render();
  loadStatus();
})();
</script>
<script src="./omsaze-shell.js" data-label="Demo"></script>
</body>
</html>
